#:schema node_modules/wrangler/config-schema.json
name = "tempmail"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Runtime config (MAIL_DOMAINS, MESSAGE_TTL_MINUTES) is managed in the Cloudflare
# dashboard, NOT in this file, so anyone can set their domains without editing code.
# keep_vars stops every deploy from deleting those dashboard values. See the note
# at the bottom of this file.
keep_vars = true

# ── Static assets (the built apps/web UI) ──
# The Worker serves FE + BE from one URL. run_worker_first so /api & /ws
# are handled by the Worker, the rest falls through to the SPA. Path is relative to apps/api/ -> sibling apps/web.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

# ── D1 (SQLite) ──
# No database_id on purpose. Cloudflare auto-provisions a D1 database on the
# first deploy (Deploy to Cloudflare button / Workers Builds) and binds it here.
# The Worker creates its own tables on first run, so there is nothing to set up.
[[d1_databases]]
binding = "DB"
database_name = "tempmail"

# ── Durable Object (realtime WebSocket push) ──
[[durable_objects.bindings]]
name = "INBOX"
class_name = "InboxRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxRoom"]

# ── Cron: purge expired emails every 10 minutes ──
[triggers]
crons = ["*/10 * * * *"]

# ── Observability (Workers Logs) ──
# Enables persistent logs + traces so email() and the API can be debugged from
# the dashboard (Worker -> Observability / Logs). Translated from the snippet
# the dashboard asked to add.
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ── Configuration lives in the DASHBOARD, not here ──
# MAIL_DOMAINS and MESSAGE_TTL_MINUTES are set in the Cloudflare dashboard
# (Worker -> Settings -> Variables and secrets), so anyone can add or change
# domains without touching code or the CLI. They are intentionally NOT listed
# here: a var written in [vars] would OVERWRITE the dashboard value on every
# deploy. keep_vars = true (at the top) tells Cloudflare to leave the dashboard
# values alone.
#
#   MAIL_DOMAINS         comma-separated; the FIRST domain = default in the UI
#                        e.g. "jimel.eu.cc,indomie.eu.cc"
#   MESSAGE_TTL_MINUTES  email/address lifetime in minutes (default 60)
#
# For local dev, put them in apps/api/.dev.vars (gitignored) instead.
