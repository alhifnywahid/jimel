#:schema node_modules/wrangler/config-schema.json
name = "tempmail"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# ── Static assets (the built apps/web UI) ──
# The Worker serves FE + BE from one URL. run_worker_first so /api & /ws
# are handled by the Worker, the rest falls through to the SPA. Path is relative to apps/api/ -> sibling apps/web.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

# ── D1 (SQLite) ──
# No database_id on purpose. Cloudflare auto-provisions a D1 database on the
# first deploy (Deploy to Cloudflare button / Workers Builds) and binds it here.
# The Worker creates its own tables on first run, so there is nothing to set up.
[[d1_databases]]
binding = "DB"
database_name = "tempmail"

# ── Durable Object (realtime WebSocket push) ──
[[durable_objects.bindings]]
name = "INBOX"
class_name = "InboxRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InboxRoom"]

# ── Cron: purge expired emails every 10 minutes ──
[triggers]
crons = ["*/10 * * * *"]

# ── Configuration (self-hosters may change these) ──
[vars]
# Your email domains, comma-separated. The catch-all of EVERY domain must be pointed
# at this Worker (Email Routing). The FIRST domain = default in the UI.
# Multi-domain example: MAIL_DOMAINS = "jimel.email,mail2.io,tempbox.dev"
MAIL_DOMAINS = "example.com"
# Email retention in minutes (default 60 = 1 hour).
MESSAGE_TTL_MINUTES = "60"
