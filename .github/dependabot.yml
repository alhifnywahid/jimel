version: 2
updates:
  # Satu lockfile di root monorepo → satu entri npm sudah mencakup semua workspace.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Patch & minor digabung jadi satu PR supaya tidak membanjiri repo.
      minor-dan-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # React major di-upgrade manual - sering butuh perubahan kode.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # Tailwind major mengubah sintaks konfigurasi.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
