changelog:
  exclude:
    labels:
      - ignore-for-release
      - duplicate
      - invalid
  categories:
    - title: New features
      labels: ["enhancement", "feature"]
    - title: Bug fixes
      labels: ["bug", "fix"]
    - title: Security
      labels: ["security"]
    - title: Documentation
      labels: ["documentation"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other
      labels: ["*"]
