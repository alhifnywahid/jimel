name: Feature request
description: An idea to make JIMEL more useful
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing any code, open this issue first. A 10-minute discussion is
        better than a 500-line PR that turns out not to fit the project's direction.

        Some things are already out of scope - see the
        "What may be rejected" section in [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the real situation, not the solution directly. What is difficult right now?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Your proposal
      description: What does it look like from the user's side? If it touches the API, write an example request/response.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Including how you work around it today without this feature.

  - type: dropdown
    id: area
    attributes:
      label: Which part is affected
      multiple: true
      options:
        - UI / frontend
        - REST API
        - Realtime (WebSocket / polling)
        - Email receiving (email handler)
        - Database / D1 schema
        - Deploy & setup
        - Documentation
        - Not sure yet
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Fits the project constraints
      description: JIMEL must keep running entirely inside a single Worker.
      options:
        - label: This proposal does not need a new external service (Redis, queue, another database)
        - label: This proposal does not add authentication to the public API
        - label: I am willing to work on the PR if this proposal is accepted
