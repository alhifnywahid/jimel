<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="JIMEL - disposable email on Cloudflare Workers, with an example temporary inbox">
  <defs>
    <clipPath id="frame"><rect width="1200" height="420" rx="16"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#F0B429"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#0B0D12"/>
    <circle cx="916" cy="210" r="300" fill="url(#glow)"/>

    <!-- Left column: identity -->
    <rect x="64" y="92" width="28" height="3" rx="1.5" fill="#5EEAD4"/>
    <text x="104" y="100" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" letter-spacing="2.4" fill="#8C97A8">DISPOSABLE EMAIL · CLOUDFLARE WORKERS</text>
    <text x="64" y="184" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="92" font-weight="800" letter-spacing="-2" fill="#F4F7FB">JIMEL</text>
    <text x="64" y="232" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="27" fill="#AEB8C7">Temporary inboxes that live for 60 minutes.</text>
    <text x="64" y="268" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="27" fill="#AEB8C7">UI, REST, WebSocket, email receiver - one Worker.</text>

    <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#AEB8C7" text-anchor="middle">
      <rect x="64" y="316" width="52" height="34" rx="9" fill="#141821" stroke="#232A36"/><text x="90" y="339">D1</text>
      <rect x="128" y="316" width="178" height="34" rx="9" fill="#141821" stroke="#232A36"/><text x="217" y="339">Durable Objects</text>
      <rect x="318" y="316" width="158" height="34" rx="9" fill="#141821" stroke="#232A36"/><text x="397" y="339">Email Routing</text>
      <rect x="488" y="316" width="108" height="34" rx="9" fill="#141821" stroke="#232A36"/><text x="542" y="339">React 19</text>
    </g>

    <!-- Right column: temporary inbox -->
    <rect x="696" y="56" width="440" height="308" rx="14" fill="#141821" stroke="#232A36"/>

    <rect x="720" y="80" width="336" height="42" rx="10" fill="#0B0D12" stroke="#263041"/>
    <text x="736" y="107" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#5EEAD4">k7m2q9x@jimel.email</text>
    <rect x="1068" y="80" width="44" height="42" rx="10" fill="#1A202C" stroke="#263041"/>
    <rect x="1082" y="90" width="14" height="17" rx="3" fill="none" stroke="#8C97A8" stroke-width="2"/>
    <rect x="1087" y="95" width="14" height="17" rx="3" fill="#1A202C" stroke="#8C97A8" stroke-width="2"/>

    <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" fill="#8C97A8">
      <text x="720" y="150">37 minutes left</text>
      <text x="1112" y="150" text-anchor="end">TTL 60 minutes</text>
    </g>
    <rect x="720" y="162" width="392" height="6" rx="3" fill="#232A36"/>
    <rect x="720" y="162" width="242" height="6" rx="3" fill="url(#ttl)"/>

    <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
      <circle cx="728" cy="208" r="4.5" fill="#5EEAD4"/>
      <text x="746" y="212" font-size="19" fill="#E8ECF2">GitHub</text>
      <text x="746" y="234" font-size="17" fill="#8C97A8">Verify your email address</text>
      <text x="1112" y="212" font-size="16" fill="#5EEAD4" text-anchor="end">new</text>
      <line x1="720" y1="240" x2="1112" y2="240" stroke="#1B2230"/>

      <circle cx="728" cy="262" r="4.5" fill="#3B4354"/>
      <text x="746" y="266" font-size="19" fill="#E8ECF2">Vercel</text>
      <text x="746" y="288" font-size="17" fill="#8C97A8">Login link (expires in 10 minutes)</text>
      <text x="1112" y="266" font-size="16" fill="#8C97A8" text-anchor="end">2 min</text>
      <line x1="720" y1="294" x2="1112" y2="294" stroke="#1B2230"/>

      <circle cx="728" cy="316" r="4.5" fill="#3B4354"/>
      <text x="746" y="320" font-size="19" fill="#E8ECF2">Cloudflare</text>
      <text x="746" y="342" font-size="17" fill="#8C97A8">Your deployment succeeded</text>
      <text x="1112" y="320" font-size="16" fill="#8C97A8" text-anchor="end">9 min</text>
    </g>
  </g>
</svg>
